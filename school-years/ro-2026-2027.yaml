# Romanian pre-university school year 2026-2027.
# Source: Ordinul ministrului educației nr. 3.194/2026 privind structura anului
# școlar 2026-2027 (Monitorul Oficial).
name: ro-2026-2027

# Teaching modules (cursuri). Dates are inclusive.
modules:
  - {start: 2026-09-07, end: 2026-10-23}   # module 1; autumn break 24 Oct - 1 Nov
  - {start: 2026-11-02, end: 2026-12-22}   # module 2; winter break 23 Dec - 10 Jan
  # Module 3 ends and module 4 starts around the one-week February "mobile"
  # break, which each county inspectorate picks: 15-21 Feb, 22-28 Feb or
  # 1-7 Mar 2027. TODO: confirm the week chosen by ISJ Iași when it is
  # announced; 22-28 Feb is assumed here.
  - {start: 2027-01-11, end: 2027-02-19}   # module 3
  - {start: 2027-03-01, end: 2027-04-23}   # module 4; spring break 24 Apr - 4 May
  - {start: 2027-05-05, end: 2027-06-18}   # module 5; summer break from 19 Jun

# Days without classes that fall inside a module.
holidays:
  - {date: 2026-10-05, name: Ziua Internațională a Educației}
  - {date: 2026-11-30, name: Sfântul Andrei}
  - {date: 2026-12-01, name: Ziua Națională a României}
  - {date: 2027-06-01, name: Ziua Copilului}

# Grades whose courses end before the general end date.
grade_end_dates:
  8: 2027-06-11
  12: 2027-06-04
