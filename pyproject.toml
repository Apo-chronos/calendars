[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "uaic-calendar-importer"
version = "0.1.0"
description = "Selectively convert UAIC class-schedule PDFs into publishable ICS feeds."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["pdfplumber>=0.11", "tzdata>=2025.2"]

[project.scripts]
calendar-import = "calendars.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/calendars"]

[tool.pytest.ini_options]
testpaths = ["tests"]

